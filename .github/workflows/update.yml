name: Weekly GamesMod Generator

on:
  schedule:
    # يشتغل تلقائياً كل 7 أيام (كل يوم أحد الساعة 00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # يتيح لك تشغيله يدوياً في أي وقت

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-3.x
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Bot Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONETAG_AD_LINK: ${{ secrets.MONETAG_AD_LINK }}
        run: python bot.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Weekly Auto-Update GamesMod Pages" || exit 0
          git push
